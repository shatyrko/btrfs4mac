name: Release

# Push a tag such as v0.3.1 and this builds the DMG and publishes the release.
# Run by hand ("Run workflow") it only builds the DMG and keeps it as a workflow artifact: nothing is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version label for a test build (nothing is published)
        default: 0.0.0-test

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the DMG
        run: VERSION="${{ steps.version.outputs.version }}" scripts/make-dmg.sh

      - name: Keep the DMG as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: btrfs4mac-${{ steps.version.outputs.version }}
          path: |
            build/btrfs4mac-*.dmg
            build/btrfs4mac-*.dmg.sha256

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="$GITHUB_REF_NAME"
          FILES=(build/btrfs4mac-*.dmg build/btrfs4mac-*.dmg.sha256)
          PREVIOUS="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            cat .github/release-notes.md
            if [ -n "$PREVIOUS" ]; then
              printf '\n## Changes since %s\n\n' "$PREVIOUS"
              git log --pretty='- %s' "$PREVIOUS..$TAG"
            fi
          } > build/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "btrfs4mac $VERSION" --notes-file build/notes.md
          fi
